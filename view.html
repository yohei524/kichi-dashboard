<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>㐂の暦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css?v=260827d">
</head>
<body>

<header id="header"></header>
<div class="container" id="app">
  <p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">読み込み中…</p>
</div>
<footer id="footer"></footer>

<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-content" id="detailContent"></div>
</div>

<script>
// 旧Service Workerが古いCSS/JSをキャッシュし続ける事故のため、SWを全解除しキャッシュを消す（260717）。
// /abby など view.html を直接開く人のSWも、これで確実に外れる。
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    var had=rs.length>0;
    rs.forEach(function(r){r.unregister()});
    if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}
    if(had&&!sessionStorage.getItem('sw_cleared')){sessionStorage.setItem('sw_cleared','1');location.reload(true)}
  });
}
</script>
<script src="core.js?v=260827d"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var client = params.get('client');
  // Vercelのrewritesはサーバー内部の書き換えのため、ブラウザのURL・
  // location.searchには反映されない。/view.html自体への直接アクセス以外は
  // 常にURLパスの末尾セグメントから読み取る（例：/hidetoh → "hidetoh"）。
  if (!client) {
    var path = window.location.pathname.replace(/\/+$/, '');
    var seg = path.split('/').pop();
    if (seg && seg !== 'view.html' && seg !== '') client = seg;
  }
  // 「/○○-koyomi」（暦ページ用URL）はJSONファイル名の「○○」に読み替える。
  // 例：/abby-koyomi → clients/abby.json。これが無いと abby-koyomi.json を探して失敗する。
  if (client) client = client.replace(/-koyomi$/, '');
  // URLのパス名とJSONのファイル名が違う場合の対応表。
  // 表示名は「Hidetoさん」が正しいが、JSONは hidetoh.json のまま（既存URL互換のため）。
  var ALIAS = { 'hideto': 'hidetoh' };
  if (ALIAS[client]) client = ALIAS[client];
  var app = document.getElementById('app');
  if (!client) {
    app.innerHTML = '<p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">クライアント指定がありません（?client=名前 が必要です）</p>';
    return;
  }
  // 後半をロック（見出しだけ見せて本文ぼかし＋申し込み導線）するクライアント。
  // rewriteのクエリはブラウザに届かないため、ここに名前を足すのが唯一の方法。
  var PREVIEW_LOCKED = { 'demo': 1, 'asuka': 1 };
  var isPreview = !!PREVIEW_LOCKED[client] || (params.get('preview') === '1');

  fetch('clients/' + client + '.json')
    .then(function (res) {
      if (!res.ok) throw new Error('データが見つかりません: ' + client);
      return res.json();
    })
    .then(function (data) {
      // 画像パスはクライアントごとのフォルダを見に行く（images/はclients/images/を指す）
      initDashboard(data);
      if (data.fortuneTimeline && data.fortuneTimeline.length) insertFortuneTimeline(data);
      if (isPreview) {
        applyPreviewLock();
        if (client === 'demo') insertPaletteNote(data);
      }
    })
    .catch(function (err) {
      app.innerHTML = '<p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">' + err.message + '</p>';
    });

  // 半年ほどの運気の流れを、折れ線グラフとして簡易に見せる。
  // data.fortuneTimeline がある client だけ表示（他clientには影響しない）。
  // レベルは -2〜+2 の5段階（-2=月天中殺等の低調期、+2=大半会等の最高潮）。
  function insertFortuneTimeline(data) {
    var points = data.fortuneTimeline;
    if (!points || !points.length) return;
    var w = 320, h = 120, padX = 24, padY = 18;
    var stepX = (w - padX * 2) / (points.length - 1);
    var levelToY = function (lv) {
      // level: -2..2 -> y: (h-padY)..padY
      var t = (lv + 2) / 4; // 0..1
      return (h - padY) - t * (h - padY * 2);
    };
    var coords = points.map(function (p, i) {
      return { x: padX + stepX * i, y: levelToY(p.level) };
    });
    var pathD = coords.map(function (c, i) {
      return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1);
    }).join(' ');
    var accent = (data.design && data.design.accentColor) || '#C77B2E';

    var dots = coords.map(function (c, i) {
      var p = points[i];
      var isLow = p.level <= -2;
      var r = isLow ? 5 : 4;
      var fill = isLow ? '#C97A6A' : accent;
      return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="' + r + '" fill="' + fill + '"></circle>';
    }).join('');

    var labels = coords.map(function (c, i) {
      return '<text x="' + c.x.toFixed(1) + '" y="' + (h - 2) + '" font-size="9" text-anchor="middle" fill="var(--color-brown)">' + points[i].label + '</text>';
    }).join('');

    var svg =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block;">' +
      '<line x1="' + padX + '" y1="' + levelToY(0) + '" x2="' + (w - padX) + '" y2="' + levelToY(0) + '" stroke="var(--color-line,#ddd)" stroke-dasharray="3,3"></line>' +
      '<path d="' + pathD + '" fill="none" stroke="' + accent + '" stroke-width="2"></path>' +
      dots + labels +
      '</svg>';

    var notesHTML = points.map(function (p) {
      var mark = p.level <= -2 ? '▽' : (p.level >= 2 ? '▲' : '・');
      return '<p class="text-xs" style="color:var(--color-brown);margin-top:.2rem">' + mark + ' <b>' + p.label + '</b>　' + p.note + '</p>';
    }).join('');

    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>この先の運気の流れ（半年）</span></div>' +
      svg +
      '<div style="margin-top:.4rem">' + notesHTML + '</div>';

    // 「本日の運気」カードの直後に差し込む（一番上の日付カードの次）。
    // app 直下の子要素を順に見て、最初の .card（日付）の次に挿入。無ければ先頭に追加。
    var firstCard = null;
    for (var i = 0; i < app.children.length; i++) {
      if (app.children[i].className && app.children[i].className.indexOf('card') !== -1) {
        firstCard = app.children[i];
        break;
      }
    }
    if (firstCard) {
      app.insertBefore(card, firstCard.nextSibling);
    } else {
      app.insertBefore(card, app.firstChild);
    }
  }

  // デモページ用：配色は命式の五行エネルギーに合わせて一人ずつ決めている、という設計思想を
  // 一言添えて伝える（選べる機能ではなく、命式ごとに㐂が調整しているという説明）
  function insertPaletteNote(data) {
    var note = document.createElement('p');
    note.className = 'demo-palette-note';
    note.textContent = '※ 配色は命式の五行エネルギーに合わせて、一人ひとり㐂が調整しています';
    app.insertBefore(note, app.firstChild);
  }

  // デモページ用：画面の途中から下は「見出し（目次）だけ見える・本文はぼかす」形にして、
  // 何が入っているかは伝わるが中身は読めない状態にする。申し込み導線のオーバーレイも重ねる。
  function applyPreviewLock() {
    var cards = app.querySelectorAll('.card');
    if (cards.length === 0) return;
    var lockFrom = Math.ceil(cards.length / 2);
    var firstLocked = cards[lockFrom];
    if (!firstLocked) return;

    var wrap = document.createElement('div');
    wrap.className = 'preview-lock-wrap';
    firstLocked.parentNode.insertBefore(wrap, firstLocked);

    var toc = document.createElement('div');
    toc.className = 'preview-lock-toc';
    var tocTitle = document.createElement('p');
    tocTitle.className = 'preview-lock-toc-title';
    tocTitle.textContent = 'この続きに入っている内容';
    toc.appendChild(tocTitle);

    for (var i = lockFrom; i < cards.length; i++) {
      var card = cards[i];
      var headerEl = card.querySelector('.card-header');
      if (headerEl) {
        var tocLine = document.createElement('p');
        tocLine.className = 'preview-lock-toc-item';
        tocLine.textContent = '◆ ' + headerEl.textContent.replace(/^◆/, '').trim();
        toc.appendChild(tocLine);
      }
      var body = document.createElement('div');
      body.className = 'preview-lock-body-blur';
      while (card.firstChild) body.appendChild(card.firstChild);
      card.appendChild(body);
      wrap.appendChild(card);
    }
    wrap.insertBefore(toc, wrap.firstChild);

    var overlay = document.createElement('div');
    overlay.className = 'preview-lock-overlay';
    overlay.innerHTML =
      '<p class="preview-lock-title">ここから先は本鑑定でお渡しする内容です</p>' +
      '<p class="preview-lock-cta-body">あなた専用のページとして毎日見返せる形でお渡ししています。</p>' +
      '<a href="https://nanafushi-tsumugi-intro.vercel.app/" target="_blank" rel="noopener" class="preview-lock-button">▶ 紡の席について見る</a>';
    wrap.appendChild(overlay);
  }
})();
</script>
</body>
</html>
