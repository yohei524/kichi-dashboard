<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>㐂の暦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
</head>
<body>

<header id="header"></header>
<div class="container" id="app">
  <p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">読み込み中…</p>
</div>
<footer id="footer"></footer>

<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-content" id="detailContent"></div>
</div>

<script src="core.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var client = params.get('client');
  // Vercelのrewritesはサーバー内部の書き換えのため、ブラウザのURL・
  // location.searchには反映されない。/view.html自体への直接アクセス以外は
  // 常にURLパスの末尾セグメントから読み取る（例：/hidetoh → "hidetoh"）。
  if (!client) {
    var path = window.location.pathname.replace(/\/+$/, '');
    var seg = path.split('/').pop();
    if (seg && seg !== 'view.html' && seg !== '') client = seg;
  }
  var app = document.getElementById('app');
  if (!client) {
    app.innerHTML = '<p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">クライアント指定がありません（?client=名前 が必要です）</p>';
    return;
  }
  var isPreview = (client === 'demo') || (params.get('preview') === '1');

  fetch('clients/' + client + '.json')
    .then(function (res) {
      if (!res.ok) throw new Error('データが見つかりません: ' + client);
      return res.json();
    })
    .then(function (data) {
      // 画像パスはクライアントごとのフォルダを見に行く（images/はclients/images/を指す）
      initDashboard(data);
      if (isPreview) applyPreviewLock();
    })
    .catch(function (err) {
      app.innerHTML = '<p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">' + err.message + '</p>';
    });

  // デモページ用：画面の途中から下をぼかして隠し、申し込み導線のオーバーレイを重ねる
  function applyPreviewLock() {
    var cards = app.querySelectorAll('.card');
    if (cards.length === 0) return;
    var lockFrom = Math.ceil(cards.length / 2);
    var wrap = document.createElement('div');
    wrap.className = 'preview-lock-wrap';
    var firstLocked = cards[lockFrom];
    if (!firstLocked) return;
    firstLocked.parentNode.insertBefore(wrap, firstLocked);
    for (var i = lockFrom; i < cards.length; i++) {
      wrap.appendChild(cards[i]);
    }
    var overlay = document.createElement('div');
    overlay.className = 'preview-lock-overlay';
    overlay.innerHTML =
      '<p class="preview-lock-title">ここから先は本鑑定でお渡しする内容です</p>' +
      '<p class="preview-lock-body">宿命の詳細解説・5つの視点・5人の占術家視点・陽転陰転パターンなど、<br>' +
      'あなた専用のページとして毎日見返せる形でお渡ししています。</p>' +
      '<a href="https://sensenkyokyo.stores.jp/" target="_blank" rel="noopener" class="preview-lock-button">▶ 鑑定を申し込む(㐂のstores)</a>';
    wrap.appendChild(overlay);
  }
})();
</script>
</body>
</html>
