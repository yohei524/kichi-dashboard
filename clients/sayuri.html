<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さゆりさんの暦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-cream: #F0F7F9;
  --color-warm-white: #F5FAFB;
  --color-beige: #E0F0F5;
  --color-accent: #1E7A7A;
  --color-accent-light: #2D9B9B;
  --color-accent-soft: #7ABFBF;
  --color-gold: #4A8C8C;
  --color-brown: #456B6B;
  --color-brown-dark: #1F4949;
  --color-rose-light: #D6F0F0;
  --color-water: #1E6B7E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif JP', serif; background: linear-gradient(180deg, var(--color-warm-white) 0%, var(--color-cream) 60%, #EEF7F9 100%); color: var(--color-brown-dark); min-height: 100vh; line-height: 1.8; letter-spacing: 0.05em; }
.container { max-width: 28rem; margin: 0 auto; padding: 0 1rem 2rem; }
header { text-align: center; padding: 2rem 1rem 1rem; }
header .sub { font-size: 0.75rem; color: var(--color-accent); letter-spacing: 0.2em; margin-bottom: 0.5rem; }
header h1 { font-size: 1.35rem; font-weight: 500; color: var(--color-brown-dark); margin-bottom: 0.25rem; }
header .tagline { font-size: 0.8rem; color: var(--color-brown); }
.card { background: var(--color-warm-white); border: 1px solid var(--color-beige); border-radius: 8px; padding: 1.25rem; box-shadow: 0 2px 16px rgba(30, 122, 122, 0.08); margin-bottom: 1.5rem; animation: fadeIn 0.5s ease-out; }
.card-header { font-size: 0.875rem; font-weight: 500; color: var(--color-brown-dark); margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--color-beige); display: flex; align-items: center; gap: 0.5rem; }
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--color-accent-light), transparent); margin: 1.5rem 0; }
.message-box { background: var(--color-cream); border: 1px solid var(--color-beige); border-radius: 4px; padding: 1rem 1.25rem; position: relative; }
.message-box::before { content: '\201C'; position: absolute; top: -0.25rem; left: 0.75rem; font-size: 2rem; color: var(--color-accent-soft); font-family: serif; }
.patterns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.pattern-title { font-size: 0.75rem; text-align: center; margin-bottom: 0.75rem; letter-spacing: 0.1em; }
.pattern-title.win { color: var(--color-accent); }
.pattern-title.lose { color: var(--color-water); }
.pattern-list { list-style: none; }
.pattern-list li { font-size: 0.75rem; color: var(--color-brown-dark); display: flex; align-items: start; gap: 0.5rem; margin-bottom: 0.5rem; line-height: 1.6; }
.dot-win { color: var(--color-accent); margin-top: 2px; }
.dot-lose { color: var(--color-water); margin-top: 2px; }
.meishiki-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--color-beige); }
.meishiki-item:last-child { border-bottom: none; }
.meishiki-label { font-size: 0.75rem; color: var(--color-brown); }
.meishiki-value { font-size: 0.875rem; font-weight: 500; }
.year-tenchu-box { background: linear-gradient(135deg, rgba(30,122,122,0.10), rgba(30,122,122,0.07)); border: 1px solid rgba(30, 122, 122, 0.25); border-radius: 4px; padding: 1rem; text-align: center; margin-bottom: 1rem; }
.year-tenchu-label { font-size: 0.7rem; color: var(--color-water); letter-spacing: 0.15em; margin-bottom: 0.25rem; }
.year-tenchu-body { font-size: 0.8rem; color: var(--color-brown-dark); line-height: 1.7; }
footer { text-align: center; padding: 1.5rem; border-top: 1px solid var(--color-beige); }
footer p { font-size: 0.75rem; color: var(--color-accent); letter-spacing: 0.15em; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.text-center { text-align: center; }
.text-xs { font-size: 0.75rem; }
.text-sm { font-size: 0.875rem; }
.mb-1 { margin-bottom: 0.25rem; }
.mb-2 { margin-bottom: 0.5rem; }
.mb-3 { margin-bottom: 0.75rem; }
.mb-4 { margin-bottom: 1rem; }
.mb-6 { margin-bottom: 1.5rem; }
.mt-2 { margin-top: 0.5rem; }
.mt-3 { margin-top: 0.75rem; }
.date-display { font-size: 1.5rem; font-weight: 300; color: var(--color-brown-dark); letter-spacing: 0.1em; }
.date-month { font-size: 0.9rem; color: var(--color-accent); }
</style>
</head>
<body>

<header id="header"></header>
<div class="container" id="app">
  <p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">読み込み中…</p>
</div>
<footer id="footer"></footer>

<script>
const CLIENT_DATA = {
  "client": {
    "name": "さゆりさん",
    "dayStem": "乙",
    "dayStemReading": "きのと",
    "element": "水",
    "elementNote": "乙亥。水上に浮かぶ柳の根。柔軟性と深さを持つ木。水性89が圧倒的で、火性ゼロ。自分から発信することが極めて難しい命式。でも学び・思考・研究の世界では無限の深さがある。静かに存在することで、周囲に恵まれる設計。",
    "tenchu": "申酉天中殺",
    "tenchuNote": "伝統と革新を繋ぐ使命。古いものと新しいものの橋渡し役。西方欠け（結婚・パートナーシップに課題）。だからこそ、独立して自分のペースで生きることが陽転の条件。",
    "specialStructure": "生年天中殺、日座天中殺、西方欠け",
    "specialNote": "親の援助なしで独立すると陽転。家系を離れて生きることで、本来の力が発揮される。在宅で、細く長く、好きなことをやる。それが許されている命式。",
    "stars": "中心:龍高星 / 東:牽牛星 / 北:司禄星 / 南:石門星 / 西:玉堂星 / 伴:龍高星",
    "starsNote": "改革と冒険の中心（龍高星）。責任と社会的役割（牽牛星）。人を集める力（石門星）。教え・伝える役割（玉堂星）。火性ゼロで発信困難だが、水89（学習力）が本領。",
    "chukuseiNote": "現在は禄存星の時期（人を惹きつける10年）。2026年は調舒星年運で個性を磨く年。2028-2029年は年天中殺への準備期間。目立たない活動が開花する時期。",
    "guardianNote": "第一守護神は存在しない（火性ゼロ）。だからこそ『何もしない』が守護神の取り方。来たものだけを受け取る。無理して動かない。それが最大のパワー。"
  },
  "yearTenchuNote": "2026年7月〜2027年6月は、申酉天中殺の使命が最も光る時期。特に2027年3月（龍高星月運・天禄星）は申し分ない。この時期に『古いものと新しいものを繋ぐ活動』を具体化させておくと、2028-2029年の年天中殺中も軸がぶれない。陰影に入る2027年後半までに『これだけは続ける』を決めておく。",
  "yotenPatterns": [
    "在宅で、自分のペースで、好きなことを続ける（申酉天中殺の陽転パターン）",
    "古いものと新しいものを繋ぐ活動に集中する（使命そのもの）",
    "火性ゼロだから、発信しない。来たものだけ受け取る",
    "学び・研究・思考を深める（水89の本領）",
    "龍高星（改革）と伴星龍高星（ご先祖の使命）が示す道を歩む",
    "牽牛星（責任）を引き受けながらも、自分のペースを守る",
    "石門星（人を集める力）を信じて、自然な繋がりを大切にする",
    "玉堂星（教え・伝える）の才能を、自分のやり方で表現する"
  ],
  "intenPatterns": [
    "『やらなきゃ』という焦燥感で動く（火性ゼロだから追い立てられると詰まる）",
    "SNS・発信に無理して力を入れる（発信できない命式。水89の学びが本領）",
    "家系を背負おうとする（生年天中殺・日座天中殺。独立すると陽転）",
    "パートナーシップに固執する（西方欠け。一人で完結する設計）",
    "新規拡大を急ぐ（2028-2029年の年天中殺前は準備期間）",
    "誰かに頼ろうとする（親の援助なしで初めて力が出る）",
    "現在の活動を『小さい』と評価する（龍高星の改革は静かに起きる）",
    "火性ゼロを弱みと捉える（学びと思考の深さが圧倒的な強み）"
  ],
  "fiveViews": [
    {"key": "【壱】時間軸視点", "body": "乙亥という木の根が水に浮かぶ人生設計。生年・日座の二重天中殺で、人生のサイクルが通常より『ずれている』。今57歳で禄存星の時期（人を惹きつける10年）。2026年7月〜2027年6月は、調舒星年運で個性を磨く最高の時期。この期間は『新しく何かを始める』ことも、古いものと新しいものを『繋ぐ活動』も、光る配置になってる。2027年後半から陰影に入り、2028-2029年が年天中殺。だから今は『蓄える時間』ではなく『使命を形にする時間』。"},
    {"key": "【弐】人間関係視点", "body": "中心龍高星は改革と冒険。東牽牛星は責任を引き受けてくれる人。南石門星は人を集める力。これらが全部向かってるのが『誰かのためでなく、自分たちの世界を守り続けること』。西玉堂星の『教え・伝える』は、声高に発信することではなく、質問に答える・教える・深掘りすることで自然に現れる。火性ゼロだからこそ、派手でない形で人間関係が構築される。伴星龍高星（ご先祖の使命）が示してるのは『革新は静かに起きる』ということ。"},
    {"key": "【参】才能視点", "body": "火性ゼロ（発信できない）× 水89（学び・研究が本領）。司禄星（北方）が才能星なのに、北天運。つまり『思考優先で行動しにくい』設計。でもここが龍高星との組み合わせの妙——龍高星の改革は『考えて、考えて、考え抜いた先に起きる』。だからこそ、在宅で・一人で・深く考え続けることが才能の発揮になる。玉堂星（西）で『教え・伝える』も、スクール運営・著作・メール相談など、自分のペースで完結できる形なら圧倒的に光る。水89はカラカラに枯れる心配がない。学べば学ぶほど深くなる。"},
    {"key": "【肆】課題視点", "body": "生年天中殺（親の援助なしで初めて力が出る）＋ 日座天中殺（家系を離れて初めて独立）＋ 西方欠け（結婚・パートナーシップにトラブル）。三重苦に見えるが、陽転の方法は明確。『一人で完結する活動』を選ぶこと。在宅・独立・好きなことに集中——これが逆に最大の強みになる。火性ゼロで『やらなきゃ』という焦燥感がないから、持続力が圧倒的。20年・30年かけてやる仕事が向く。2028-2029年の年天中殺中は『新規拡大せず、深掘り』。それまでに『これだけは続ける』を決めておく。"},
    {"key": "【伍】使命視点", "body": "申酉天中殺は『古いものと新しいものを繋ぐ』使命。伴星龍高星は『ご先祖の革新的な営み』を受け継ぐこと。5つの視点が同じ方向を向いてる。今、2026年7月〜2027年6月は、この使命が最も光る時期。特に2027年3月（龍高星月運・天禄星）は申し分ない配置。この時期に『古いものと新しいものを繋ぐ活動』を具体化させておくと、2028-2029年の年天中殺中も軸がぶれない。火性ゼロから来る『発信できない』は弱みじゃなく、特殊な才能配置。龍高星の改革は、派手な形では起きない。水を流すように、知らない間に形が変わってる——その時間設計が今、最高に機能してる。"}
  ],
  "design": {
    "accentColor": "#1E7A7A",
    "headerSub": "― 乙亥・龍高星の暦 ―",
    "headerTitle": "さゆりの暦",
    "headerTagline": "古いものと新しいものを繋ぐ人",
    "footerText": "― 火がなくても、結ぶことで火は生まれる ―"
  }
};

const D = CLIENT_DATA;

function getToday() {
  var n = new Date();
  return { month: n.getMonth()+1, day: n.getDate(), year: n.getFullYear() };
}

function getJapaneseDate(m, d) {
  var ms = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var ds = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',11:'十一',12:'十二',13:'十三',14:'十四',15:'十五',16:'十六',17:'十七',18:'十八',19:'十九',20:'二十',21:'二十一',22:'二十二',23:'二十三',24:'二十四',25:'二十五',26:'二十六',27:'二十七',28:'二十八',29:'二十九',30:'三十',31:'三十一'};
  return { month: ms[m] || (m+'月'), day: (ds[d] || (d+'日')) + (ds[d]?'日':'') };
}

function render() {
  var t = getToday();
  var m = t.month, d = t.day, y = t.year;
  var jpDate = getJapaneseDate(m, d);

  document.getElementById('header').innerHTML =
    '<p class="sub">' + D.design.headerSub + '</p>' +
    '<h1>' + D.design.headerTitle + '</h1>' +
    '<p class="tagline">' + D.design.headerTagline + '</p>';

  document.getElementById('footer').innerHTML = '<p>' + D.design.footerText + '</p>';

  var app = document.getElementById('app');
  var html = '';

  html += '<div class="card">';
  html += '<div class="text-center mb-6">';
  html += '<p class="text-xs" style="color:var(--color-brown)">令和八年</p>';
  html += '<p class="date-display"><span class="date-month">' + jpDate.month + '</span><span style="margin:0 0.5rem">' + jpDate.day + '</span></p>';
  html += '</div>';
  html += '<div class="divider"></div>';

  html += '<div class="card-header" style="border:none;padding-bottom:0"><span style="color:var(--color-accent)">◆</span><span>' + D.client.name + 'の宿命</span></div>';
  html += '<div class="meishiki-item"><span class="meishiki-label">日干</span><span class="meishiki-value">' + D.client.dayStem + '(' + D.client.dayStemReading + ') = ' + D.client.element + '性</span></div>';
  html += '<div class="meishiki-item"><span class="meishiki-label">天中殺</span><span class="meishiki-value">' + D.client.tenchu + '</span></div>';
  if (D.client.specialStructure) html += '<div class="meishiki-item"><span class="meishiki-label">特殊構造</span><span class="meishiki-value" style="font-size:0.78rem">' + D.client.specialStructure + '</span></div>';
  if (D.client.stars) html += '<div class="meishiki-item"><span class="meishiki-label">主星配置</span><span class="meishiki-value" style="font-size:0.67rem;text-align:right;line-height:1.6">' + D.client.stars + '</span></div>';

  html += '<div class="message-box" style="margin-top:1rem"><p class="text-sm" style="padding-left:1rem;line-height:1.8">' + D.client.elementNote + '</p></div>';

  if (D.client.starsNote) html += '<p class="text-xs mt-3" style="color:var(--color-brown);line-height:1.7">' + D.client.starsNote + '</p>';
  if (D.client.chukuseiNote) {
    html += '<div class="message-box" style="margin-top:0.75rem;background:rgba(30,122,122,0.08);border-color:var(--color-accent-soft)">';
    html += '<p class="text-xs" style="padding-left:1rem;line-height:1.75;color:var(--color-brown-dark)">' + D.client.chukuseiNote + '</p>';
    html += '</div>';
  }
  if (D.client.guardianNote) html += '<p class="text-xs mt-3" style="color:var(--color-accent);line-height:1.7;font-style:italic;text-align:center">' + D.client.guardianNote + '</p>';

  html += '<div class="divider"></div>';

  html += '<div class="year-tenchu-box">';
  html += '<p class="year-tenchu-label">🌀 2028〜2030年 年天中殺について</p>';
  html += '<p class="year-tenchu-body">' + D.yearTenchuNote + '</p>';
  html += '</div>';

  html += '</div>';

  html += '<div class="card">';
  html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>さゆりさんの 陽・陰パターン</span></div>';
  html += '<div class="patterns">';
  html += '<div><p class="pattern-title win">陽</p><ul class="pattern-list">';
  for (var i = 0; i < D.yotenPatterns.length; i++) html += '<li><span class="dot-win">◇</span><span>' + D.yotenPatterns[i] + '</span></li>';
  html += '</ul></div>';
  html += '<div><p class="pattern-title lose">陰</p><ul class="pattern-list">';
  for (var i = 0; i < D.intenPatterns.length; i++) html += '<li><span class="dot-lose">×</span><span>' + D.intenPatterns[i] + '</span></li>';
  html += '</ul></div>';
  html += '</div>';
  html += '</div>';

  if (D.fiveViews && D.fiveViews.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>- in depth -　５つの視点</span></div>';
    html += '<p class="text-xs mb-3" style="color:var(--color-brown);line-height:1.7">同じ命式を 複数の角度で読み解く。</p>';
    for (var i = 0; i < D.fiveViews.length; i++) {
      var v = D.fiveViews[i];
      html += '<div style="margin-bottom:0.85rem;padding:0.7rem 0.9rem;background:var(--color-cream);border-left:3px solid var(--color-accent-light);border-radius:0 4px 4px 0">';
      html += '<p class="text-xs" style="color:var(--color-accent);font-weight:500;letter-spacing:0.15em;margin-bottom:0.25rem">' + v.key + '</p>';
      html += '<p class="text-xs" style="color:var(--color-brown-dark);line-height:1.75">' + v.body + '</p>';
      html += '</div>';
    }
    html += '</div>';
  }

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
