html+='<div class="frame"><p class="text-xs text-center mb-3" style="color:var(--color-accent);letter-spacing:0.2em">あなたの願い</p>';html+='<p class="text-center text-sm font-medium" style="color:var(--color-brown-dark)">'+D.goal.main+'</p><div class="divider"></div>';html+='<p class="text-xs text-center" style="color:var(--color-brown);line-height:1.8">'+D.goal.sub.replace(/\\n/g,'<br>').replace(/\n/g,'<br>')+'</p></div>';
app.innerHTML=html}
render();
</script>
</body>
