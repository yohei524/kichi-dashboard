function getFortuneByDate(month, day, year) {
  if (!year) year = (month >= 6 && month <= 12) ? 2026 : 2027;
  var calc = computeFortune(year, month, day);
  var key = month + '/' + day;
  var adv = (dailyAdvice[key] && dailyAdvice[key].advice) ? dailyAdvice[key].advice : '';
  var aspEmo = [];
  for (var i = 0; i < calc.aspects.length; i++) {
    var a = calc.aspects[i], emoji = '';
    if (a.indexOf('天中殺') >= 0) emoji = '🌀';
    else if (a.indexOf('天剋地冲') >= 0) emoji = '🌊';
    else if (a.indexOf('干合') >= 0) emoji = '🔗';
    else if (a.indexOf('支合') >= 0) emoji = '🤝';
    else if (a.indexOf('半会') >= 0 || a.indexOf('大半会') >= 0) emoji = '🌼';
    else if (a.indexOf('対冲') >= 0) emoji = '🌊';
    else if (a.indexOf('害') >= 0) emoji = '💫';
    else if (a.indexOf('刑') >= 0) emoji = '⚡';
    else if (a.indexOf('律音') >= 0) emoji = '🎵';
    else if (a.indexOf('納音') >= 0) emoji = '🔔';
    aspEmo.push(a + (emoji || ''));
  }
  return { date: calc.date, kanshi: calc.kanshi, mainStar: calc.mainStar, jyusei: calc.jyusei, aspects: aspEmo.length > 0 ? aspEmo.join(' ') : '-', isTenchu: calc.isTenchu, advice: adv };
}

  var ds = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',11:'十一',12:'十二',13:'十三',14:'十四',15:'十五',16:'十六',17:'十七',18:'十八',19:'十九',20:'二十',21:'二十一',22:'二十二',23:'二十三',24:'二十四',25:'二十五',26:'二十六',27:'二十七',28:'二十八',29:'二十九',30:'三十',31:'三十一'};
  return { month: ms[m] || (m+'月'), day: (ds[d] || d) + '日' };
}
function getCurrentMonthFortune(m, d, y) {
  var today = (y === 2027 ? 1200 : 0) + m * 100 + d;
  for (var i = 0; i < D.monthlyFortunes.length; i++) {
    var f = D.monthlyFortunes[i];
    var match = f.period.match(/(?:(\d{4})\/)?(\d+)\/(\d+)〜(?:(\d{4})\/)?(\d+)\/(\d+)/);
    if (!match) continue;
    var sY = match[1] ? +match[1] : 2026, sM = +match[2], sD = +match[3];
    var eY = match[4] ? +match[4] : sY, eM = +match[5], eD = +match[6];
    var sKey = (sY === 2027 ? 1200 : 0) + sM * 100 + sD;
    var eKey = (eY === 2027 ? 1200 : 0) + eM * 100 + eD;
    if (today >= sKey && today <= eKey) return f;
  }
  return D.monthlyFortunes[0];
}
function getDaysUntil(year, month, day) {
  var now = new Date(); now.setHours(0,0,0,0);
  var diff = Math.ceil((new Date(year, month-1, day) - now) / (1000*60*60*24));
  return diff > 0 ? diff : 0;
}

  if (D.todos && D.todos.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>今日の一歩👣</span></div>';
    for (var i = 0; i < D.todos.length; i++) {
      var t = D.todos[i];
      var pcls = (t.priority === 1) ? 'priority-high' : 'priority-normal';
      html += '<div class="task-item ' + pcls + '"><div class="task-header"><span class="task-title">' + t.task + '</span>';
      if (t.deadline) html += '<span class="badge badge-warning">' + t.deadline + '</span>';
      html += '</div><p class="task-reason">' + t.reason + '</p></div>';
    }
    html += '</div>';
  }

  // 願い
  html += '<div class="frame">';
  html += '<p class="text-xs text-center mb-3" style="color:var(--color-accent);letter-spacing:0.2em">天命・目標</p>';
  html += '<p class="text-center text-sm font-medium" style="color:var(--color-brown-dark)">' + D.goal.main + '</p>';
  html += '<div class="divider"></div>';
  html += '<p class="text-xs text-center" style="color:var(--color-brown);line-height:1.8">' + D.goal.sub.replace(/\\n/g,'<br>').replace(/\n/g,'<br>') + '</p>';
  html += '</div>';

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
