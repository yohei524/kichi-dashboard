<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダリヤさんの暦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 木・金・土 — 深緑×ゴールド×土色 */
  --color-cream: #F4F7F0;
  --color-warm-white: #F9FCF6;
  --color-beige: #DDE8D4;
  --color-accent: #3A6B35;        /* 深緑(甲の木) */
  --color-accent-light: #5D9655;  /* 緑 */
  --color-accent-soft: #A8C89E;   /* 淡緑 */
  --color-gold: #8B6914;          /* 金性ゴールド */
  --color-gold-light: #C09A3A;
  --color-brown: #5C4A2A;
  --color-brown-dark: #2E2A18;
  --color-rose: #C4763A;
  --color-rose-light: #F5E8D8;
  --color-sage: #7A9160;
  --color-water: #4A6070;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif JP', serif;
  background: linear-gradient(180deg, var(--color-warm-white) 0%, var(--color-cream) 60%, #FCE9D6 100%);
  color: var(--color-brown-dark);
  min-height: 100vh;
  line-height: 1.8;
  letter-spacing: 0.05em;
}

.container { max-width: 28rem; margin: 0 auto; padding: 0 1rem 2rem; }

header { text-align: center; padding: 2rem 1rem 1rem; }
header .sub { font-size: 0.75rem; color: var(--color-accent); letter-spacing: 0.2em; margin-bottom: 0.5rem; }
header h1 { font-size: 1.35rem; font-weight: 500; color: var(--color-brown-dark); margin-bottom: 0.25rem; }
header .tagline { font-size: 0.8rem; color: var(--color-brown); }

.card {
  background: var(--color-warm-white);
  border: 1px solid var(--color-beige);
  border-radius: 8px;
  padding: 1.25rem;
  box-shadow: 0 2px 16px rgba(194, 73, 31, 0.08);
  margin-bottom: 1.5rem;
  animation: fadeIn 0.5s ease-out;
}

.card-header {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--color-brown-dark);
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--color-beige);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-accent-light), transparent);
  margin: 1.5rem 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.75rem;
  font-size: 0.7rem;
  border-radius: 100px;
  font-weight: 400;
}
.badge-info { background: rgba(184, 134, 44, 0.18); color: var(--color-gold); border: 1px solid rgba(184, 134, 44, 0.35); }
.badge-danger { background: rgba(212, 86, 74, 0.18); color: #8E2A20; border: 1px solid rgba(212, 86, 74, 0.4); }
.badge-warning { background: rgba(224, 122, 74, 0.2); color: #A04510; border: 1px solid rgba(224, 122, 74, 0.4); }
.badge-success { background: rgba(168, 144, 96, 0.2); color: #6A5530; border: 1px solid rgba(168, 144, 96, 0.4); }
.badge-fire { background: rgba(194, 73, 31, 0.18); color: var(--color-accent); border: 1px solid rgba(194, 73, 31, 0.4); }

.message-box {
  background: var(--color-cream);
  border: 1px solid var(--color-beige);
  border-radius: 4px;
  padding: 1rem 1.25rem;
  position: relative;
}
.message-box::before {
  content: '\201C';
  position: absolute;
  top: -0.25rem;
  left: 0.75rem;
  font-size: 2rem;
  color: var(--color-accent-soft);
  font-family: serif;
}

.task-item {
  padding: 1rem;
  background: var(--color-cream);
  border-left: 3px solid var(--color-accent);
  margin-bottom: 0.75rem;
  border-radius: 0 4px 4px 0;
}
.task-item.priority-high { border-left-color: var(--color-rose); }
.task-item.priority-normal { border-left-color: var(--color-accent-light); }

.task-header { display: flex; align-items: start; justify-content: space-between; margin-bottom: 0.25rem; }
.task-title { font-size: 0.875rem; font-weight: 500; }
.task-reason { font-size: 0.75rem; color: var(--color-brown); }

.star-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
.star-box { text-align: center; padding: 0.75rem; background: var(--color-cream); border-radius: 4px; }
.star-label { font-size: 0.7rem; color: var(--color-brown); margin-bottom: 0.25rem; }
.star-value { font-size: 0.95rem; font-weight: 500; color: var(--color-accent); }

.aspects { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }

.tenchu-box {
  background: var(--color-rose-light);
  border: 1px solid rgba(212, 86, 74, 0.3);
  border-radius: 4px;
  padding: 1rem;
  text-align: center;
}
.tenchu-label { font-size: 0.75rem; color: #8E2A20; margin-bottom: 0.25rem; }
.tenchu-days { font-size: 2rem; font-weight: 300; color: #8E2A20; }
.tenchu-days span { font-size: 0.875rem; margin-left: 0.25rem; }
.tenchu-note { font-size: 0.75rem; color: #8E2A20; margin-top: 0.25rem; }

.patterns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.pattern-title { font-size: 0.75rem; text-align: center; margin-bottom: 0.75rem; letter-spacing: 0.1em; }
.pattern-title.win { color: var(--color-accent); }
.pattern-title.lose { color: var(--color-water); }
.pattern-list { list-style: none; }
.pattern-list li { font-size: 0.75rem; color: var(--color-brown-dark); display: flex; align-items: start; gap: 0.5rem; margin-bottom: 0.5rem; line-height: 1.6; }
.dot-win { color: var(--color-accent); margin-top: 2px; }
.dot-lose { color: var(--color-water); margin-top: 2px; }

.frame {
  position: relative;
  padding: 1.5rem;
  background: var(--color-warm-white);
  border: 1px solid var(--color-beige);
  border-radius: 4px;
  box-shadow: 0 2px 12px rgba(194, 73, 31, 0.1);
  margin-bottom: 1.5rem;
}
.frame::before {
  content: '';
  position: absolute;
  top: 8px; left: 8px; right: 8px; bottom: 8px;
  border: 1px solid var(--color-accent-soft);
  border-radius: 2px;
  pointer-events: none;
}

/* 命式カード */
.meishiki-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--color-beige);
}
.meishiki-item:last-child { border-bottom: none; }
.meishiki-label { font-size: 0.75rem; color: var(--color-brown); }
.meishiki-value { font-size: 0.875rem; font-weight: 500; }

/* カレンダー */
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 0.5rem;
}
.cal-header { text-align: center; font-size: 0.65rem; color: var(--color-brown); padding: 0.25rem 0; }
.cal-cell {
  text-align: center; padding: 0.35rem 0.1rem; font-size: 0.75rem;
  border-radius: 4px; cursor: pointer; min-height: 2.6rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid transparent; position: relative;
  background: var(--color-warm-white);
}
.cal-cell:hover { border-color: var(--color-accent-light); }
.cal-cell.today { border: 2px solid var(--color-accent); font-weight: 600; box-shadow: 0 0 8px rgba(194, 73, 31, 0.3); }
.cal-cell.empty { cursor: default; background: transparent; }
.cal-cell.empty:hover { border-color: transparent; }
.cal-cell .cal-day { font-size: 0.78rem; }
.cal-cell .cal-aspect { font-size: 0.55rem; margin-top: 1px; }
.cal-cell.tenchu-day { border-left: 2px solid var(--color-rose); }

.cal-legend { display: flex; justify-content: center; gap: 0.75rem; font-size: 0.65rem; color: var(--color-brown); flex-wrap: wrap; margin-top: 0.5rem; }
.cal-month-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.cal-month-tab {
  flex: 1; text-align: center; padding: 0.5rem; font-size: 0.75rem;
  background: var(--color-cream); border-radius: 4px; cursor: pointer;
  color: var(--color-brown); border: 1px solid var(--color-beige);
}
.cal-month-tab.active { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }

/* 詳細モーダル */
.detail-modal {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(75, 45, 31, 0.5); z-index: 100; align-items: center; justify-content: center;
  padding: 1rem;
}
.detail-modal.active { display: flex; }
.detail-content {
  background: var(--color-warm-white); border-radius: 8px; padding: 1.5rem;
  max-width: 26rem; width: 100%; max-height: 85vh; overflow-y: auto;
  border: 1px solid var(--color-beige); box-shadow: 0 8px 32px rgba(194, 73, 31, 0.25);
}
.detail-close {
  background: none; border: none; font-size: 1.5rem; color: var(--color-brown);
  cursor: pointer; float: right; padding: 0; line-height: 1;
}
.detail-date-stars { font-size: 0.95rem; font-weight: 500; color: var(--color-brown-dark); }
.detail-day-stars { font-size: 0.8rem; color: var(--color-accent); margin-left: 0.5rem; }
.detail-section { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--color-beige); }
.detail-label { font-size: 0.7rem; color: var(--color-accent); letter-spacing: 0.1em; margin-bottom: 0.25rem; }
.detail-text { font-size: 0.8rem; color: var(--color-brown-dark); line-height: 1.7; }

footer {
  text-align: center;
  padding: 1.5rem;
  border-top: 1px solid var(--color-beige);
}
footer p { font-size: 0.75rem; color: var(--color-accent); letter-spacing: 0.15em; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.text-center { text-align: center; }
.text-xs { font-size: 0.75rem; }
.text-sm { font-size: 0.875rem; }
.mb-1 { margin-bottom: 0.25rem; }
.mb-2 { margin-bottom: 0.5rem; }
.mb-3 { margin-bottom: 0.75rem; }
.mb-4 { margin-bottom: 1rem; }
.mb-6 { margin-bottom: 1.5rem; }
.mt-2 { margin-top: 0.5rem; }
.mt-3 { margin-top: 0.75rem; }
.font-medium { font-weight: 500; }

.date-display { font-size: 1.5rem; font-weight: 300; color: var(--color-brown-dark); letter-spacing: 0.1em; }
.date-month { font-size: 0.9rem; color: var(--color-accent); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--color-cream); }
::-webkit-scrollbar-thumb { background: var(--color-accent-light); border-radius: 2px; }
</style>
</head>

<div class="container" id="app">
  <p class="text-center text-sm" style="color:var(--color-brown);padding:2rem 0">読み込み中…</p>
</div>
<footer id="footer"></footer>

<!-- 日詳細モーダル -->

function _kidx(y,m,d){var r=Date.UTC(2000,0,1);var t=Date.UTC(y,m-1,d);return((Math.round((t-r)/864e5)%60)+60+54)%60}

function _bs(myStem,br){return BSA[BSM[J12[myStem][br]]]}
function _asp(s,b){
  var a=[],ps=[{s:MY.ds,b:MY.db,n:'日柱'},{s:MY.ms,b:MY.mb,n:'月柱'},{s:MY.ys,b:MY.yb,n:'年柱'}];
  var go=[[0,5],[1,6],[2,7],[3,8],[4,9]],sg=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
  var hk=[[2,6,10],[5,9,1],[8,0,4],[11,3,7]];
  var dh=[[0,4],[4,8],[8,0],[1,5],[5,9],[9,1],[2,6],[6,10],[10,2],[3,7],[7,11],[11,3]];
  var tc=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]],ga=[[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]];
  var jk=[4,6,9,11],kk=[1,4,7,10];
  for(var i=0;i<ps.length;i++){var p=ps[i];

    for(var t2=0;t2<tc.length;t2++){if((b===tc[t2][0]&&p.b===tc[t2][1])||(b===tc[t2][1]&&p.b===tc[t2][0])){a.push(p.n+'：対冲');break}}

    var sk=[2,5,8];if(sk.indexOf(b)>=0&&sk.indexOf(p.b)>=0&&b!==p.b)a.push(p.n+'：生刑');
    if((b===0&&p.b===3)||(b===3&&p.b===0))a.push(p.n+'：旺刑');
    if(s!==p.s&&b===p.b){var sum1=(s+b)%10,sum2=(p.s+p.b)%10;if(sum1===sum2)a.push(p.n+'：納音')}
  }
  if(MY.tc.indexOf(b)>=0)a.push('日天中殺');
  return a;
}

function computeFortune(y,m,d){
  var idx=_kidx(y,m,d),si=idx%10,bi=idx%12;
  var k=STEMS[si]+BRANCHES[bi],ms=_ms(MY.ds,si),bs=_bs(MY.ds,bi);

}

  var adv = (dailyAdvice[key] && dailyAdvice[key].advice) ? dailyAdvice[key].advice : '';
  // aspects 配列→絵文字付き文字列
  var aspEmo = [];
  for (var i = 0; i < calc.aspects.length; i++) {

    if (a.indexOf('天中殺') >= 0) emoji = '🌀';
    else if (a.indexOf('天剋地冲') >= 0) emoji = '🌊';
    else if (a.indexOf('干合') >= 0) emoji = '🔗';

}

function getJapaneseDate(m, d) {
  var ms = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var ds = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',
    11:'十一',12:'十二',13:'十三',14:'十四',15:'十五',16:'十六',17:'十七',18:'十八',19:'十九',20:'二十',
    21:'二十一',22:'二十二',23:'二十三',24:'二十四',25:'二十五',26:'二十六',27:'二十七',28:'二十八',29:'二十九',30:'三十',31:'三十一'};
  return { month: ms[m] || (m+'月'), day: (ds[d] || (d+'日')) + (ds[d]?'日':'') };
}

function getCurrentMonthFortune(m, d, y) {
  var today;
  if (y === 2026) today = m * 100 + d;
  else if (y === 2027) today = 1200 + m * 100 + d; // 2027は加算
  else return D.monthlyFortunes[0];
  for (var i = 0; i < D.monthlyFortunes.length; i++) {
    var f = D.monthlyFortunes[i];
    var match = f.period.match(/(?:(\d{4})\/)?(\d+)\/(\d+)〜(?:(\d{4})\/)?(\d+)\/(\d+)/);
    if (!match) continue;
    var sY = match[1] ? +match[1] : 2026, sM = +match[2], sD = +match[3];
    var eY = match[4] ? +match[4] : sY, eM = +match[5], eD = +match[6];
    if (eY < sY) eY = sY;
    var sKey = (sY === 2027 ? 1200 : 0) + sM * 100 + sD;
    var eKey = (eY === 2027 ? 1200 : 0) + eM * 100 + eD;
    if (today >= sKey && today <= eKey) return f;
  }
  return D.monthlyFortunes[0];
}

function isInTenchuPeriod(m, d, y) {
  if (!D.monthlyTenchuPeriod) return false;
  if (y !== D.monthlyTenchuPeriod.endYear) return false;
  var p = D.monthlyTenchuPeriod;
  var today = m * 100 + d;
  return today >= p.startMonth * 100 + p.startDay && today <= p.endMonth * 100 + p.endDay;
}

function getDaysUntil(year, month, day) {
  var now = new Date(); now.setHours(0,0,0,0);
  var target = new Date(year, month - 1, day);
  var diff = Math.ceil((target - now) / (1000*60*60*24));
  return diff > 0 ? diff : 0;
}

    var el = document.getElementById('cal-grid-' + i);
    if (el) el.style.display = (i === idx) ? '' : 'none';
    var tab = document.getElementById('cal-tab-' + i);
    if (tab) tab.className = 'cal-month-tab' + (i === idx ? ' active' : '');
  }
}

function openDetail(year, month, day) {
  var f = getFortuneByDate(month, day, year);
  var jdesc = jyuseiDesc[f.jyusei] || '';
  var html = '<button class="detail-close" onclick="closeDetail()">×</button>';
  html += '<p class="detail-date-stars">' + year + '年' + month + '月' + day + '日<span class="detail-day-stars"> ' + f.kanshi + ' / ' + f.mainStar + '・' + f.jyusei + '</span></p>';
  if (f.aspects && f.aspects !== '-') {
    html += '<div class="detail-section"><p class="detail-label">位相法</p><p class="detail-text">' + f.aspects + '</p></div>';
  }
  if (jdesc) {
    html += '<div class="detail-section"><p class="detail-label">今日のエネルギー(' + f.jyusei + ')</p><p class="detail-text">' + jdesc + '</p></div>';
  }
  if (f.advice) {
    html += '<div class="detail-section"><p class="detail-label">㐂からの一言</p><p class="detail-text">' + f.advice + '</p></div>';
  }
  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').classList.add('active');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('active');
}

// ========== 描画 ==========
function render() {
  var t = getToday();
  var m = t.month, d = t.day, y = t.year;
  var jpDate = getJapaneseDate(m, d);
  var currentMonth = getCurrentMonthFortune(m, d, y);
  var inTenchu = isInTenchuPeriod(m, d, y);
  var todayF = (y === 2026 && ((m === 6 && d >= 7) || m === 7)) ? getFortuneByDate(m, d, y) : null;

  document.getElementById('header').innerHTML =
    '<p class="sub">' + D.design.headerSub + '</p>' +
    '<h1>' + D.design.headerTitle + '</h1>' +
    '<p class="tagline">' + D.design.headerTagline + '</p>';

  document.getElementById('footer').innerHTML = '<p>' + D.design.footerText + '</p>';

  var app = document.getElementById('app');
  var html = '';

  // 日付と命式
  html += '<div class="card">';
  html += '<div class="text-center mb-6">';
  html += '<p class="text-xs" style="color:var(--color-brown)">令和八年</p>';
  html += '<p class="date-display"><span class="date-month">' + jpDate.month + '</span><span style="margin:0 0.5rem">' + jpDate.day + '</span></p>';
  html += '</div>';
  html += '<div class="divider"></div>';

  html += '<div class="card-header" style="border:none;padding-bottom:0"><span style="color:var(--color-accent)">◆</span><span>' + D.client.name + 'の宿命</span></div>';
  html += '<div class="meishiki-item"><span class="meishiki-label">日干</span><span class="meishiki-value">' + D.client.dayStem + '(' + D.client.dayStemReading + ') = ' + D.client.element + '</span></div>';
  html += '<div class="meishiki-item"><span class="meishiki-label">天中殺</span><span class="meishiki-value">' + D.client.tenchu + '</span></div>';
  if (D.client.specialStructure) html += '<div class="meishiki-item"><span class="meishiki-label">特殊構造</span><span class="meishiki-value">' + D.client.specialStructure + '</span></div>';
  if (D.client.stars) html += '<div class="meishiki-item"><span class="meishiki-label">主星配置</span><span class="meishiki-value" style="font-size:0.7rem;text-align:right">' + D.client.stars + '</span></div>';

  html += '<div class="message-box" style="margin-top:1rem"><p class="text-sm" style="padding-left:1rem;line-height:1.8">' + D.client.elementNote + '</p></div>';

  if (D.client.starsNote) {
    html += '<p class="text-xs mt-3" style="color:var(--color-brown);line-height:1.7">' + D.client.starsNote + '</p>';
  }

  if (D.client.tenshunNote) {
    html += '<div class="message-box" style="margin-top:0.75rem;background:rgba(224,122,74,0.1);border-color:var(--color-accent-soft)">';
    html += '<p class="text-xs" style="padding-left:1rem;line-height:1.75;color:var(--color-brown-dark)">' + D.client.tenshunNote + '</p>';
    html += '</div>';
  }
  if (D.client.fireNeedNote) {
    html += '<p class="text-xs mt-3" style="color:var(--color-accent);line-height:1.7;font-style:italic;text-align:center">' + D.client.fireNeedNote + '</p>';
  }

  html += '<div class="divider"></div>';

  // 今月の流れ
  if (currentMonth) {
    html += '<div class="mb-4">';
    html += '<p class="text-xs text-center mb-2" style="color:var(--color-brown);letter-spacing:0.15em">今月の流れ</p>';
    html += '<div class="text-center">';
    html += '<p class="text-sm mb-1"><span style="color:var(--color-brown)">' + currentMonth.period + '</span><span style="margin:0 0.5rem">|</span><span style="color:var(--color-accent);font-weight:500">' + currentMonth.kanshi + ' ' + currentMonth.mainStar + '</span></p>';
    if (currentMonth.aspects && currentMonth.aspects !== '-') html += '<p class="text-xs" style="color:var(--color-brown)">' + currentMonth.aspects + '</p>';
    if (currentMonth.isTenchu) html += '<span class="badge badge-danger">月天中殺</span>';
    html += '</div>';
    html += '<p class="text-xs text-center mt-2" style="color:var(--color-brown-dark);line-height:1.7">' + currentMonth.advice + '</p>';
    html += '</div>';
  }

  if (inTenchu && D.monthlyTenchuPeriod) {
    html += '<div class="tenchu-box">';
    html += '<p class="tenchu-label">月天中殺終了まで</p>';
    html += '<p class="tenchu-days">' + getDaysUntil(D.monthlyTenchuPeriod.endYear, D.monthlyTenchuPeriod.endMonth, D.monthlyTenchuPeriod.endDay + 1) + '<span>日</span></p>';
    html += '<p class="tenchu-note">' + D.monthlyTenchuPeriod.endMonth + '月' + (D.monthlyTenchuPeriod.endDay + 1) + '日から動き出せる</p>';
    html += '</div>';
  }
  html += '</div>';

  // 今日の運気
  if (todayF) {
    var jdesc = jyuseiDesc[todayF.jyusei] || '';
    html += '<div class="card">';
    html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>本日の運気</span></div>';
    html += '<div class="star-grid">';
    html += '<div class="star-box"><p class="star-label">主星</p><p class="star-value">' + todayF.mainStar + '</p></div>';
    html += '<div class="star-box"><p class="star-label">従星</p><p class="star-value">' + todayF.jyusei + '</p></div>';
    html += '</div>';
    if (todayF.aspects && todayF.aspects !== '-') {
      html += '<p class="text-xs text-center mb-3" style="color:var(--color-brown)">' + todayF.aspects + '</p>';
    }
    if (jdesc) html += '<p class="text-xs" style="background:var(--color-cream);padding:0.6rem;border-radius:4px;color:var(--color-brown-dark);line-height:1.7">' + jdesc + '</p>';
    if (todayF.advice) html += '<p class="text-xs mt-2" style="color:var(--color-accent);line-height:1.7;font-weight:500">' + todayF.advice + '</p>';
    html += '</div>';
  }

  // 日運カレンダー
  html += '<div class="card">';
  html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>日運カレンダー</span></div>';
  html += '<div class="cal-month-tabs">';
  for (var i = 0; i < calMonths.length; i++) {
    html += '<div id="cal-tab-' + i + '" class="cal-month-tab' + (i === currentCalIdx ? ' active' : '') + '" onclick="switchCalMonth(' + i + ')">' + calMonths[i].label + '</div>';
  }
  html += '</div>';
  for (var i = 0; i < calMonths.length; i++) {
    var cm = calMonths[i];
    html += '<div id="cal-grid-' + i + '" style="' + (i === currentCalIdx ? '' : 'display:none') + '">';
    html += buildMonthGridHTML(cm.y, cm.m, m, d, y);
    html += '</div>';
  }
  html += '<div class="cal-legend">';
  html += '<span class="cal-legend-item">🎵 律音</span>';
  html += '<span class="cal-legend-item">🔗 干合</span>';
  html += '<span class="cal-legend-item">🤝 支合</span>';
  html += '<span class="cal-legend-item">🌼 半会</span>';
  html += '<span class="cal-legend-item">💫 害</span>';
  html += '<span class="cal-legend-item">⚡ 刑</span>';
  html += '<span class="cal-legend-item">🌊 冲</span>';
  html += '<span class="cal-legend-item">🌀 天中殺</span>';
  html += '</div>';
  html += '<p class="text-xs text-center mt-2" style="color:var(--color-brown);font-size:0.65rem">日付をタップで詳細</p>';
  html += '</div>';

  // 大切にすること・気をつけること
  html += '<div class="card">';
  html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>hiromiさんの 勝ち筋・避け筋</span></div>';
  html += '<div class="patterns">';
  html += '<div><p class="pattern-title win">大切にすること</p><ul class="pattern-list">';
  for (var i = 0; i < D.winPatterns.length; i++) html += '<li><span class="dot-win">◇</span><span>' + D.winPatterns[i] + '</span></li>';
  html += '</ul></div>';
  html += '<div><p class="pattern-title lose">気をつけること</p><ul class="pattern-list">';
  for (var i = 0; i < D.losePatterns.length; i++) html += '<li><span class="dot-lose">×</span><span>' + D.losePatterns[i] + '</span></li>';
  html += '</ul></div>';
  html += '</div>';
  html += '</div>';

  // 5視点
  if (D.fiveViews && D.fiveViews.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>五つの視点 ─ ぐるりと見る</span></div>';
    html += '<p class="text-xs mb-3" style="color:var(--color-brown);line-height:1.7">同じ命式を 違う角度から見たメモや。 hiromiさんの命の動き方を 五方向から確かめる。</p>';
    for (var i = 0; i < D.fiveViews.length; i++) {
      var v = D.fiveViews[i];
      html += '<div style="margin-bottom:0.85rem;padding:0.7rem 0.9rem;background:var(--color-cream);border-left:3px solid var(--color-accent-light);border-radius:0 4px 4px 0">';
      html += '<p class="text-xs" style="color:var(--color-accent);font-weight:500;letter-spacing:0.15em;margin-bottom:0.25rem">' + (i+1) + '. ' + v.key + '</p>';
      html += '<p class="text-xs" style="color:var(--color-brown-dark);line-height:1.75">' + v.body + '</p>';
      html += '</div>';
    }
    html += '</div>';
  }

  // やること(todos)
  if (D.todos && D.todos.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>今日の一歩👣</span></div>';
    for (var i = 0; i < D.todos.length; i++) {
      var t = D.todos[i];
      var pcls = (t.priority === 1) ? 'priority-high' : 'priority-normal';
      html += '<div class="task-item ' + pcls + '"><div class="task-header"><span class="task-title">' + t.task + '</span>';
      if (t.deadline) html += '<span class="badge badge-warning">' + t.deadline + '</span>';
      html += '</div><p class="task-reason">' + t.reason + '</p></div>';
    }
    html += '</div>';
  } else {
    html += '<div class="card">';
    html += '<div class="card-header"><span style="color:var(--color-accent)">◆</span><span>今日の一歩👣</span></div>';
    html += '<p class="text-xs text-center" style="color:var(--color-brown);padding:0.5rem 0;line-height:1.8">ここには hiromiさんの「今やること」を入れていく場所や。<br>鑑定後に決めていこ。</p>';
    html += '</div>';
  }

  // 願い
  html += '<div class="frame">';
  html += '<p class="text-xs text-center mb-3" style="color:var(--color-accent);letter-spacing:0.2em">あなたの願い</p>';
  html += '<p class="text-center text-sm font-medium" style="color:var(--color-brown-dark)">' + D.goal.main + '</p>';
  html += '<div class="divider"></div>';
  html += '<p class="text-xs text-center" style="color:var(--color-brown);line-height:1.8">' + D.goal.sub.replace(/\\n/g, '<br>').replace(/\n/g, '<br>') + '</p>';
  html += '</div>';

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
