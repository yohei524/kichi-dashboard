<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>有紀子さん 命式図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 命式図（meishiki-zu スキルの型）：縦に流れる一枚物。1画面に1つの図。柱は日・月・年の順。陽転（出口）を最後に置く */
:root {
  --bg: #F2F3F0; --surface: #FFFFFF; --ink: #1B2230; --ink2: #566074; --line: #D8DCE2;
  --hit: #B84A2C; --hit-bg: #F7E4DC; --calm: #2E6F8E; --calm-bg: #DDEBF1;
  --joy: #3C7C50; --joy-bg: #DFEEE3; --void: #7A7F8A; --void-bg: #E7E8EB;
  --focus: #2F4C8A; --focus-bg: #E3E9F6;
  --moku: #5E9B6B; --ka: #D1604A; --do: #B9923E; --kon: #8D97A6; --sui: #4C84B8;
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111621; --surface: #1A2130; --ink: #ECEAE4; --ink2: #A3AEC2; --line: #2C3548;
    --hit: #EE8663; --hit-bg: #3A2620; --calm: #79B7D4; --calm-bg: #1C3340;
    --joy: #86C698; --joy-bg: #1E3626; --void: #9AA1AF; --void-bg: #272D3A;
    --focus: #93ABE0; --focus-bg: #22304F;
    --moku: #79B586; --ka: #E67B65; --do: #D2AE5E; --kon: #AEB7C6; --sui: #6BA2D3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111621; --surface: #1A2130; --ink: #ECEAE4; --ink2: #A3AEC2; --line: #2C3548;
  --hit: #EE8663; --hit-bg: #3A2620; --calm: #79B7D4; --calm-bg: #1C3340;
  --joy: #86C698; --joy-bg: #1E3626; --void: #9AA1AF; --void-bg: #272D3A;
  --focus: #93ABE0; --focus-bg: #22304F;
  --moku: #79B586; --ka: #E67B65; --do: #D2AE5E; --kon: #AEB7C6; --sui: #6BA2D3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7; padding-inline: 16px; padding-block: 0 56px; }
.wrap { max-width: 640px; margin-inline: auto; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; text-decoration: none; font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); background: var(--surface); }
.nav a:focus-visible, .seg button:focus-visible, .cell:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { padding-block: 28px 8px; display: grid; gap: 4px; }
header .eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--ink2); }
header h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.3; text-wrap: balance; }
header .meta { font-size: 15px; color: var(--ink2); }
section { padding-block: 36px 8px; scroll-margin-top: 56px; }
h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
.lead { margin: 0 0 16px; color: var(--ink2); font-size: 15px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pillar { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 6px 12px; text-align: center; display: grid; gap: 2px; min-width: 0; }
.pillar.self { border-color: var(--focus); background: var(--focus-bg); }
.pillar .role { font-size: 13px; color: var(--ink2); font-weight: 500; }
.pillar .name { font-size: 14px; font-weight: 700; }
.glyph { font-family: var(--serif); font-weight: 900; line-height: 1.05; font-size: clamp(56px, 19vw, 92px); display: block; }
.glyph.mark { color: var(--hit); } .glyph.vd { color: var(--void); }
.pillar .zou { font-size: 12px; color: var(--ink2); }
.note { margin: 12px 0 0; font-size: 15px; color: var(--ink2); }
.note b { color: var(--hit); font-weight: 700; } .note b.v { color: var(--void); }
.ring { width: 100%; max-width: 420px; display: block; margin-inline: auto; height: auto; }
.ring .base { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.ring .lbl { font-family: var(--serif); font-weight: 700; font-size: 22px; fill: var(--ink2); text-anchor: middle; dominant-baseline: central; }
.ring .on circle { fill: var(--hit-bg); stroke: var(--hit); stroke-width: 3; }
.ring .on text { fill: var(--hit); font-weight: 900; font-size: 26px; }
.ring .vd circle { fill: var(--void-bg); stroke: var(--void); stroke-width: 2; stroke-dasharray: 4 4; }
.ring .vd text { fill: var(--void); }
.ring .vdon circle { fill: var(--void-bg); stroke: var(--void); stroke-width: 3; }
.ring .vdon text { fill: var(--void); font-weight: 900; font-size: 26px; }
.ring .arc { fill: none; stroke: var(--void); stroke-width: 44; stroke-linecap: round; opacity: .18; }
.ring .ln { stroke-width: 3; fill: none; stroke-linejoin: round; }
.ring .ln.g { stroke: var(--joy); } .ring .ln.b { stroke: var(--hit); } .ring .ln.c { stroke: var(--calm); }
.ring .ln.later { stroke-dasharray: 7 6; opacity: 0; }
.ring.full .ln.later { opacity: 1; }
.ring .ghost circle { fill: var(--surface); stroke: var(--focus); stroke-width: 2; stroke-dasharray: 5 4; opacity: .6; }
.ring .ghost text { fill: var(--focus); opacity: .7; font-weight: 700; }
.ring.full .ghost circle { fill: var(--focus-bg); stroke-dasharray: none; stroke-width: 3; opacity: 1; }
.ring.full .ghost text { opacity: 1; font-weight: 900; font-size: 26px; }
.ring .cap { font-family: var(--sans); font-size: 12px; font-weight: 700; fill: var(--ink2); text-anchor: middle; }
.ring .cap.h { fill: var(--hit); } .ring .cap.v { fill: var(--void); } .ring .cap.f { fill: var(--focus); }
.ring .center { font-family: var(--serif); font-weight: 900; font-size: 28px; fill: var(--focus); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 8px; stroke-linejoin: round; }
.ring .center.v { fill: var(--void); }
.ring .center2 { font-family: var(--sans); font-size: 14px; fill: var(--ink2); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.seg button { appearance: none; font: inherit; font-weight: 700; font-size: 15px; padding: 12px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--focus); border-color: var(--focus); color: var(--bg); }
.explain { margin-top: 12px; display: grid; gap: 8px; }
.explain p { margin: 0; font-size: 16px; }
.explain .hl { background: var(--hit-bg); border-radius: 8px; padding: 10px 12px; }
.explain .cl { background: var(--calm-bg); border-radius: 8px; padding: 10px 12px; }
.explain .vl { background: var(--void-bg); border-radius: 8px; padding: 10px 12px; }
.explain .gl { background: var(--joy-bg); border-radius: 8px; padding: 10px 12px; }
.jintai { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cell { appearance: none; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 2px 12px; text-align: center; cursor: pointer; min-width: 0; display: grid; gap: 2px; }
.cell .lb { font-size: 13px; color: var(--ink2); font-weight: 500; }
.cell .st { font-family: var(--serif); font-weight: 700; font-size: clamp(20px, 6.2vw, 28px); line-height: 1.3; }
.cell.center { background: var(--focus-bg); border-color: var(--focus); }
.cell.ju { border-style: dashed; }
.cell[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: -1px; }
.jdetail { margin-top: 10px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-height: 112px; display: grid; gap: 6px; }
.jdetail .t { font-family: var(--serif); font-weight: 700; font-size: 20px; margin: 0; }
.jdetail p { margin: 0; font-size: 16px; }
.jdetail .yo { color: var(--joy); } .jdetail .in { color: var(--ink2); font-size: 15px; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 10px; }
.bar .n { font-family: var(--serif); font-weight: 700; font-size: 24px; }
.bar .track { height: 22px; border-radius: 6px; background: var(--void-bg); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; }
.bar .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar.lack .n { color: var(--hit); }
.guard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.guard > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; min-width: 0; }
.guard .lb { font-size: 13px; color: var(--ink2); }
.guard .g { font-family: var(--serif); font-weight: 900; font-size: 44px; line-height: 1.1; display: block; }
.guard .m { font-size: 14px; }
.ryo { width: 100%; max-width: 360px; display: block; margin-inline: auto; height: auto; }
.ryo .bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.ryo .bx.c { fill: var(--hit-bg); stroke: var(--hit); stroke-width: 3; }
.ryo .s { font-family: var(--serif); font-weight: 700; font-size: 17px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ryo .s.c { fill: var(--hit); font-weight: 900; font-size: 19px; }
.ryo .p { font-family: var(--sans); font-size: 11px; fill: var(--ink2); text-anchor: middle; }
.ryo .k { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--ink2); text-anchor: middle; }
.ryo .k.c { fill: var(--hit); font-size: 15px; }
.band { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.band > div { border-radius: 8px; padding: 8px 2px; text-align: center; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.band .y { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
.band .k { font-family: var(--serif); font-weight: 900; font-size: 22px; line-height: 1.2; display: block; }
.band .t { font-size: 11px; color: var(--ink2); display: block; min-height: 1.2em; }
.band .vd { background: var(--void-bg); border-color: var(--void); }
.band .vd .k, .band .vd .y { color: var(--void); }
.band .ex { background: var(--joy-bg); border-color: var(--joy); }
.band .ex .k { color: var(--joy); }
.band .nw { outline: 2px solid var(--hit); outline-offset: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.two > div { border-radius: 12px; padding: 12px 14px; min-width: 0; }
.two h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.two ul { margin: 0; padding-left: 1.1em; font-size: 15px; display: grid; gap: 2px; }
.two .ok { background: var(--joy-bg); } .two .ok h3 { color: var(--joy); }
.two .ng { background: var(--void-bg); } .two .ng h3 { color: var(--void); }
.stars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.stars > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stars .y { font-size: 13px; color: var(--ink2); }
.stars .n { font-family: var(--serif); font-weight: 700; font-size: 19px; display: block; margin-bottom: 4px; }
.stars p { margin: 0; font-size: 14px; }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 78px auto 1fr; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.row .age { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.row .age small { display: block; font-weight: 400; font-size: 12px; color: var(--ink2); }
.row .kan { font-family: var(--serif); font-weight: 900; font-size: 30px; line-height: 1.1; }
.row .sub { font-size: 14px; color: var(--ink2); min-width: 0; }
.row .sub b { color: var(--ink); font-weight: 700; font-size: 15px; }
.row.now { border-color: var(--hit); background: var(--hit-bg); border-width: 2px; }
.row.now .kan { color: var(--hit); }
.row.void { background: var(--void-bg); }
.row.void .kan, .row.void .age { color: var(--void); }
.row.now.void { border-color: var(--hit); }
.row.exit { border-color: var(--joy); background: var(--joy-bg); }
.row.exit .kan { color: var(--joy); }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin: 3px 4px 0 0; white-space: nowrap; }
.c-hit { background: var(--hit-bg); color: var(--hit); } .c-calm { background: var(--calm-bg); color: var(--calm); }
.c-joy { background: var(--joy-bg); color: var(--joy); } .c-void { background: var(--void); color: var(--bg); }
.c-now { background: var(--hit); color: var(--bg); }
.sep { margin: 20px 0 8px; font-family: var(--serif); font-size: 18px; font-weight: 700; }
.today { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.today .kan { grid-row: span 2; font-family: var(--serif); font-weight: 900; font-size: 40px; line-height: 1; }
.today .d { font-size: 14px; color: var(--ink2); }
.mrow { display: grid; grid-template-columns: 96px auto 1fr; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.mrow .dt { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.mrow .dt small { display: block; font-weight: 400; font-size: 12px; color: var(--ink2); }
.mrow .kan { font-family: var(--serif); font-weight: 900; font-size: 26px; line-height: 1.1; }
.mrow .sub { font-size: 14px; min-width: 0; }
.mrow.void { background: var(--void-bg); }
.mrow.now { border-color: var(--hit); border-width: 2px; }
.nowtag { font-size: 12px; font-weight: 700; color: var(--hit); }
.eq { display: grid; gap: 8px; }
.eq .core { background: var(--focus-bg); border: 2px solid var(--focus); border-radius: 12px; padding: 14px; text-align: center; }
.eq .core .g { font-family: var(--serif); font-weight: 900; font-size: 28px; color: var(--ink); line-height: 1.3; display: block; }
.eq .core .s { font-size: 15px; color: var(--ink2); }
.arrow { text-align: center; color: var(--ink2); font-size: 14px; line-height: 1; }
.conds { display: grid; gap: 8px; }
.cond { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.cond .no { font-family: var(--serif); font-weight: 900; font-size: 30px; color: var(--joy); line-height: 1.1; text-align: center; }
.cond .h { font-family: var(--serif); font-weight: 700; font-size: 19px; display: block; line-height: 1.4; }
.cond .src { font-size: 13px; color: var(--ink2); display: block; margin-top: 2px; }
.cond p { margin: 4px 0 0; font-size: 15px; }
.taiou { display: grid; gap: 8px; }
.taiou > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.taiou b { display: block; font-size: 15px; } .taiou p { margin: 4px 0 0; font-size: 15px; color: var(--ink2); }
.exitbox { background: var(--joy-bg); border: 2px solid var(--joy); border-radius: 12px; padding: 14px; text-align: center; }
.exitbox .g { font-family: var(--serif); font-weight: 900; font-size: 26px; color: var(--joy); display: block; line-height: 1.3; }
.exitbox .s { font-size: 15px; }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
@media (max-width: 380px) {
  .row { grid-template-columns: 70px auto 1fr; gap: 8px; padding-inline: 10px; }
  .mrow { grid-template-columns: 84px auto 1fr; gap: 8px; padding-inline: 10px; }
  .band { grid-template-columns: repeat(3, 1fr); }
  .two, .stars { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .ring .ln, .ring .ghost circle, .ring .ghost text { transition: opacity .4s, fill .4s; } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {

    var laters = sec.querySelectorAll('.explain .later');
    function setK(full) {
      kring.classList.toggle('full', full);
      bB.setAttribute('aria-pressed', full ? 'false' : 'true'); bU.setAttribute('aria-pressed', full ? 'true' : 'false');
      for (var i = 0; i < laters.length; i++) laters[i].hidden = !full;
    }
    bB.addEventListener('click', function () { setK(false); }); bU.addEventListener('click', function () { setK(true); });
  }
  if (nowDaiun) drawRing('now', nowDaiun, '大運 ' + nowDaiun.k, '今の十年');
  if (showNen) drawRing('nen', nowNen, '今年 ' + nowNen.k, '今年');

  // ---- 人体星図 ----
  var grid = document.getElementById('jgrid'), det = document.getElementById('jdetail');
  function show(i) {
    var it = D.jintai[i];
    det.innerHTML = '<p class="t">' + esc(it.lb) + '　' + esc(it.st) + '</p><p>' + esc(it.d) + '</p>' +
      (it.yo ? '<p class="yo"><b>陽転</b>　' + esc(it.yo) + '</p>' : '') + (it['in'] ? '<p class="in"><b>陰転</b>　' + esc(it['in']) + '</p>' : '');
    for (var n = 0; n < grid.children.length; n++) grid.children[n].setAttribute('aria-pressed', n === i ? 'true' : 'false');
  }
  D.jintai.forEach(function (it, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'cell-' + i;
    b.className = 'cell' + (it.c ? ' center' : '') + (it.ju ? ' ju' : '');
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="lb">' + esc(it.lb) + '</span><span class="st">' + esc(it.st) + '</span>';
    b.addEventListener('click', function () { show(i); });
    grid.appendChild(b);
  });
  show(4);
})();
</script>
