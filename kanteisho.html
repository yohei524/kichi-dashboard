<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鑑定書 ｜ 㐂占</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#0B0F1A; --night2:#131A28; --sink:#171F30; --panel:#1B2334;
  --line:#2A3346; --accent:#D9A441; --accent-soft:#B8842C; --accent-glow:rgba(217,164,65,.14);
  --gold:#C9A24A; --text:#ECEAE4; --muted:#8A96AC; --muted2:#A9B3C6;
  --water:#6E9BC4; --fire:#D08A5A; --wood:#7FA86B; --metal:#C4C9D2; --earth:#C9A24A;
  --bad:#C97A6A; --good:#6E9BC4;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Serif JP',serif; color:var(--text); line-height:1.95; letter-spacing:.045em;
  background:
    radial-gradient(1200px 620px at 50% -12%, rgba(217,164,65,.10), transparent 60%),
    linear-gradient(180deg,#0B0F1A 0%,#0D1220 45%,#080B14 100%);
  background-attachment:fixed; min-height:100vh;
}
.wrap{max-width:30rem;margin:0 auto;padding:0 1.05rem 4rem;}

/* header */
header{text-align:center;padding:3rem 1rem 1.4rem;}
header .kicker{font-size:.68rem;letter-spacing:.32em;color:var(--accent);opacity:.9;margin-bottom:.9rem;}
header h1{font-size:1.5rem;font-weight:500;letter-spacing:.08em;margin-bottom:.5rem;}
header h1 .nm{color:var(--accent);}
header .tagline{font-size:.8rem;color:var(--muted2);letter-spacing:.1em;line-height:1.7;}
header .date{font-size:.68rem;color:var(--muted);margin-top:1rem;letter-spacing:.12em;}

/* profile strip */
.profile{
  background:linear-gradient(180deg,var(--panel),var(--sink));
  border:1px solid var(--line);border-radius:16px;padding:1.1rem 1rem;margin-bottom:1.5rem;
  display:grid;grid-template-columns:1fr 1fr;gap:.55rem .8rem;
}
.profile div{font-size:.74rem;color:var(--muted);}
.profile div b{display:block;font-size:.9rem;color:var(--text);font-weight:500;margin-top:.1rem;letter-spacing:.06em;}
.profile div.full{grid-column:1/3;}

/* section */
.sec{margin-bottom:1.65rem;}
.sec-head{
  display:flex;align-items:baseline;gap:.6rem;margin-bottom:.9rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line);
}
.sec-no{font-size:.72rem;color:var(--accent);letter-spacing:.18em;font-weight:600;}
.sec-title{font-size:1.02rem;font-weight:500;letter-spacing:.08em;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:1.25rem 1.15rem;box-shadow:0 4px 24px rgba(0,0,0,.32);margin-bottom:1rem;
}
.card p{font-size:.87rem;margin-bottom:.9rem;color:var(--text);}
.card p:last-child{margin-bottom:0;}
.card .lead{color:var(--accent);font-size:.9rem;font-weight:500;}
.hl{color:var(--accent);font-weight:500;}
.soft{color:var(--muted2);font-size:.8rem;}

/* 陰占盤 */
.meishiki{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.2rem 0 .3rem;
}
.pillar{
  background:var(--sink);border:1px solid var(--line);border-radius:12px;
  padding:.7rem .4rem;text-align:center;
}
.pillar .lbl{font-size:.6rem;color:var(--muted);letter-spacing:.06em;margin-bottom:.55rem;}
.pillar .yomi{font-size:.58rem;color:var(--muted);letter-spacing:.04em;line-height:1.3;}
.pillar .kan{font-size:1.85rem;font-weight:600;color:var(--text);line-height:1.15;}
.pillar .shi{font-size:1.85rem;font-weight:600;color:var(--accent);line-height:1.15;margin-top:.2rem;}
.pillar .zou{font-size:.62rem;color:var(--muted2);margin-top:.55rem;letter-spacing:.04em;}
.meishiki-note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:.5rem;}

/* 人体星図 */
.jintai{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;max-width:19rem;margin:.4rem auto .2rem;}
.jcell{
  background:var(--sink);border:1px solid var(--line);border-radius:11px;
  aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
}
.jcell .pos{font-size:.58rem;color:var(--muted);letter-spacing:.05em;}
.jcell .star{font-size:.92rem;font-weight:600;color:var(--text);letter-spacing:.03em;}
.jcell.center{background:linear-gradient(160deg,rgba(217,164,65,.18),var(--sink));border-color:var(--accent-soft);}
.jcell.center .star{color:var(--accent);}
.jcell.jusei-cell{background:var(--night2);}
.jcell .star.gold{color:var(--gold);}

/* 五行バー */
.gogyo{margin-top:.3rem;}
.gbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;}
.gbar .gname{width:2.6rem;font-size:.76rem;color:var(--muted2);flex-shrink:0;}
.gbar .gtrack{flex:1;height:9px;background:var(--sink);border-radius:5px;overflow:hidden;}
.gbar .gfill{height:100%;border-radius:5px;}
.gbar .gval{width:2.2rem;text-align:right;font-size:.72rem;color:var(--muted);flex-shrink:0;}
.g-wood .gfill{background:var(--wood);}
.g-fire .gfill{background:var(--fire);}
.g-earth .gfill{background:var(--earth);}
.g-metal .gfill{background:var(--metal);}
.g-water .gfill{background:var(--water);}

/* 大運テーブル */
.daiun-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.daiun{width:100%;border-collapse:collapse;font-size:.78rem;min-width:19rem;}
.daiun th{
  font-size:.66rem;color:var(--muted);font-weight:500;letter-spacing:.05em;
  padding:.4rem .3rem;border-bottom:1px solid var(--line);text-align:center;
}
.daiun td{padding:.5rem .3rem;text-align:center;border-bottom:1px solid rgba(42,51,70,.5);color:var(--text);}
.daiun td:first-child{color:var(--muted2);font-size:.72rem;white-space:nowrap;}
.daiun .tc-cell{color:var(--bad);font-size:.68rem;}
.daiun .now-row td{background:linear-gradient(90deg,rgba(217,164,65,.12),transparent);}
.daiun .now-row td:first-child{color:var(--accent);font-weight:600;}
.daiun .now-cell{color:var(--accent);font-size:.68rem;font-weight:600;}

/* timeline */
.tl{position:relative;padding-left:1.1rem;margin-top:.3rem;}
.tl::before{content:"";position:absolute;left:3px;top:.4rem;bottom:.4rem;width:2px;background:var(--line);}
.tl-item{position:relative;margin-bottom:1rem;}
.tl-item:last-child{margin-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-1.1rem;top:.45rem;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--night2);}
.tl-item.tc::before{background:var(--bad);}
.tl-when{font-size:.76rem;color:var(--accent);font-weight:600;letter-spacing:.06em;}
.tl-item.tc .tl-when{color:var(--bad);}
.tl-body{font-size:.82rem;color:var(--text);margin-top:.15rem;}

/* do / dont */
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.dobox,.dontbox{border-radius:12px;padding:.85rem .8rem;border:1px solid var(--line);}
.dobox{background:rgba(110,155,196,.08);}
.dontbox{background:rgba(201,122,106,.08);}
.dobox .h,.dontbox .h{font-size:.78rem;font-weight:600;margin-bottom:.5rem;letter-spacing:.06em;}
.dobox .h{color:var(--good);}
.dontbox .h{color:var(--bad);}
.dodont ul{list-style:none;}
.dodont li{font-size:.75rem;color:var(--text);padding-left:.9rem;position:relative;margin-bottom:.45rem;line-height:1.6;}
.dodont li:last-child{margin-bottom:0;}
.dobox li::before{content:"○";position:absolute;left:0;color:var(--good);font-size:.7rem;}
.dontbox li::before{content:"×";position:absolute;left:0;color:var(--bad);font-size:.7rem;}
@media(max-width:400px){.dodont{grid-template-columns:1fr;}}

/* 処方 */
.recipe{counter-reset:r;}
.recipe .item{display:flex;gap:.75rem;margin-bottom:1rem;}
.recipe .item:last-child{margin-bottom:0;}
.recipe .num{
  flex-shrink:0;width:1.7rem;height:1.7rem;border-radius:50%;
  background:linear-gradient(160deg,var(--accent),var(--accent-soft));
  color:var(--night);font-weight:700;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;
}
.recipe .rbody{font-size:.83rem;}
.recipe .rbody b{color:var(--accent);font-weight:600;}

/* pull quote */
.pull{
  border-left:3px solid var(--accent);padding:.6rem 0 .6rem 1rem;margin:1rem 0;
  font-size:.9rem;color:var(--muted2);font-style:normal;
}

/* closing */
.closing{
  background:linear-gradient(180deg,var(--panel),var(--sink));
  border:1px solid var(--accent-soft);border-radius:18px;padding:1.6rem 1.25rem;text-align:center;
  box-shadow:0 0 30px rgba(217,164,65,.08);
}
.closing p{font-size:.88rem;margin-bottom:.9rem;}
.closing p:last-child{margin-bottom:0;}
.closing .big{font-size:1.05rem;color:var(--accent);font-weight:500;letter-spacing:.06em;}

/* link to koyomi */
.koyomi-link{
  display:block;text-align:center;margin-top:1.5rem;padding:1rem;
  background:var(--night2);border:1px solid var(--line);border-radius:14px;
  color:var(--text);text-decoration:none;font-size:.86rem;transition:border-color .3s;
}
.koyomi-link:hover{border-color:var(--accent-soft);}
.koyomi-link .arrow{color:var(--accent);}
.koyomi-link small{display:block;color:var(--muted);font-size:.7rem;margin-top:.3rem;}

/* 日本風の引き戸（襖）― タップで左右に開く */
.door{display:block;text-align:center;padding:2.2rem 0 .5rem;margin-top:1.5rem;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.door-gate{position:relative;width:210px;height:132px;margin:0 auto 1rem;border-radius:4px;overflow:hidden;border:3px solid var(--accent-soft);box-shadow:0 4px 18px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.06);background:var(--sink);}
.door-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.05rem;letter-spacing:.28em;text-indent:.28em;color:var(--accent);text-decoration:none;font-weight:500;background:radial-gradient(120% 90% at 50% 120%,rgba(217,164,65,.22) 0%,var(--sink) 62%);}
.door-leaf{position:absolute;top:0;width:50%;height:100%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 26px),linear-gradient(170deg,var(--panel) 0%,#141B29 100%);transition:transform .55s cubic-bezier(.65,0,.35,1);z-index:2;}
.door-leaf-l{left:0;border-right:1px solid var(--line);}
.door-leaf-r{right:0;border-left:1px solid var(--line);}
.door-pull{position:absolute;top:50%;width:8px;height:26px;border-radius:3px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transform:translateY(-50%);}
.door-leaf-l .door-pull{right:8px;} .door-leaf-r .door-pull{left:8px;}
.door.open .door-leaf-l{transform:translateX(-100%);}
.door.open .door-leaf-r{transform:translateX(100%);}
.door.open .door-inner{text-shadow:0 0 12px rgba(217,164,65,.3);}
.door-note{font-size:.68rem;color:var(--muted);line-height:1.8;margin-top:.35rem;}

footer{text-align:center;padding:2.5rem 1rem 1rem;font-size:.72rem;color:var(--muted);}
footer .sig{color:var(--accent);font-size:.9rem;letter-spacing:.15em;margin-top:.5rem;}
</style>


<style>
.views .v{margin-bottom:.9rem;padding:.75rem .9rem;background:var(--sink);border-left:3px solid var(--accent-soft);border-radius:0 8px 8px 0;}
.views .v .vk{font-size:.76rem;color:var(--accent);font-weight:500;letter-spacing:.12em;margin-bottom:.3rem;}
.views .v .vb{font-size:.82rem;color:var(--text);line-height:1.8;}
.occ .o{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line);}
.occ .o:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.occ .on{font-size:.86rem;color:var(--accent);font-weight:600;letter-spacing:.06em;}
.occ .ov{font-size:.72rem;color:var(--muted);margin:.15rem 0 .5rem;}
.occ .ob{font-size:.82rem;color:var(--text);line-height:1.8;}
.pat{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.patcol{border-radius:12px;padding:.85rem .8rem;border:1px solid var(--line);}
.pat-y{background:rgba(217,164,65,.08);} .pat-n{background:rgba(110,155,196,.08);}
.pat h4{font-size:.78rem;font-weight:600;margin-bottom:.5rem;letter-spacing:.05em;}
.pat-y h4{color:var(--accent);} .pat-n h4{color:var(--good);}
.pat ul{list-style:none;} .pat li{font-size:.75rem;color:var(--text);padding-left:.9rem;position:relative;margin-bottom:.4rem;line-height:1.6;}
.pat-y li::before{content:"○";position:absolute;left:0;color:var(--accent);font-size:.7rem;}
.pat-n li::before{content:"×";position:absolute;left:0;color:var(--good);font-size:.7rem;}
@media(max-width:400px){.pat{grid-template-columns:1fr;}}
#err{color:var(--muted);text-align:center;padding:3rem 1rem;font-size:.85rem;}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  var YOMI={"甲":"きのえ","乙":"きのと","丙":"ひのえ","丁":"ひのと","戊":"つちのえ","己":"つちのと","庚":"かのえ","辛":"かのと","壬":"みずのえ","癸":"みずのと","子":"ね","丑":"うし","寅":"とら","卯":"う","辰":"たつ","巳":"み","午":"うま","未":"ひつじ","申":"さる","酉":"とり","戌":"いぬ","亥":"い"};
  var STEMS=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
  var BR=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  var ZOU={"子":"癸","丑":"己・癸・辛","寅":"甲・丙・戊","卯":"乙","辰":"戊・乙・癸","巳":"丙・庚・戊","午":"丁・己","未":"己・丁・乙","申":"庚・壬・戊","酉":"辛","戌":"戊・辛・丁","亥":"壬・甲"};
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  var params=new URLSearchParams(location.search);
  var c=params.get("c");
  if(!c){var seg=location.pathname.replace(/\/+$/,"").split("/").pop();if(seg)c=seg.replace(/-kanteisho$/,"");}
  var ALIAS={"hideto":"hidetoh"}; if(ALIAS[c])c=ALIAS[c];
  var app=document.getElementById("app");
  if(!c){app.innerHTML='<p id="err">クライアント指定がありません</p>';return;}

  fetch("clients/"+c+".json").then(function(r){if(!r.ok)throw new Error("データが見つかりません");return r.json();}).then(render).catch(function(e){app.innerHTML='<p id="err">'+esc(e.message)+'</p>';});

  function pill(k,b,z){
    return '<div class="pillar"><div class="lbl">'+k.lbl+'</div><div class="yomi">'+YOMI[k.kan]+'</div><div class="kan">'+k.kan+'</div><div class="shi">'+k.shi+'</div><div class="yomi">'+YOMI[k.shi]+'</div><div class="zou">蔵干　'+z+'</div></div>';
  }

  function render(d){
    var cl=d.client||{};
    // 暦のヘッダー（「◯◯の暦」）から呼び名を取る。自分で見るものなので「さん」は付けない。
    var name=((d.design&&d.design.headerTitle)||"").replace(/の暦$/,"").trim()||(cl.name||c).replace(/さん$/,"");
    document.title=name+"さん 鑑定書 ｜ 㐂占";
    var h="";

    // header
    h+='<header><p class="kicker">㐂占 　 命 術 本鑑定書</p>';
    h+='<h1><span class="nm">'+esc(name)+'</span> の 本鑑定</h1>';
    if(d.design&&d.design.headerTagline)h+='<p class="tagline">'+esc(d.design.headerTagline)+'</p>';
    if(cl.birth)h+='<p class="date">'+esc(cl.birth.replace(/-/g,'年',1).replace('-','月')+'日 生')+'</p>';
    h+='</header>';

    // プロフィール
    h+='<div class="profile">';
    if(cl.element)h+='<div class="full">魂の本質（日の宿命）<b>'+esc((cl.dayStem||'')+ (cl.my?BR[cl.my.db]:'') )+'</b></div>';
    if(cl.stars)h+='';
    h+='<div>中心の星<b>'+esc((d.starChart&&d.starChart.center)||'-')+'</b></div>';
    h+='<div>天中殺<b>'+esc(cl.tenchu||'-')+'</b></div>';
    if(cl.specialStructure)h+='<div class="full">特別な構造<b>'+esc(cl.specialStructure)+'</b></div>';
    h+='</div>';

    // 命式盤
    if(cl.my){
      var my=cl.my;
      h+='<div class="sec"><div class="sec-head"><span class="sec-no">命 式</span><span class="sec-title">'+esc(name)+'の設計図</span></div><div class="card">';
      h+='<p class="soft" style="margin-bottom:.6rem;">陰占 ― 生まれ持った気の柱</p><div class="meishiki">';
      h+=pill({lbl:'日柱（自分・家庭）',kan:STEMS[my.ds],shi:BR[my.db]},null,ZOU[BR[my.db]]);
      h+=pill({lbl:'月柱（仕事・家系）',kan:STEMS[my.ms],shi:BR[my.mb]},null,ZOU[BR[my.mb]]);
      h+=pill({lbl:'年柱（社会・先祖）',kan:STEMS[my.ys],shi:BR[my.yb]},null,ZOU[BR[my.yb]]);
      h+='</div>';
      if(d.starChart){
        var s=d.starChart;
        h+='<div class="divider" style="height:1px;background:var(--line);margin:1.3rem 0;"></div>';
        h+='<p class="soft" style="margin-bottom:.2rem;">陽占 ― 心のかたち（人体星図）</p><div class="jintai">';
        h+='<div class="jcell jusei-cell"><span class="pos">伴星（先祖）</span><span class="star">'+esc(s.banse||'')+'</span></div>';
        h+='<div class="jcell"><span class="pos">目上（北）</span><span class="star">'+esc(s.meue||'')+'</span></div>';
        h+='<div class="jcell jusei-cell"><span class="pos">初年運</span><span class="star gold">'+esc(s.shonen||'')+'</span></div>';
        h+='<div class="jcell"><span class="pos">配偶者（西）</span><span class="star">'+esc(s.haigu||'')+'</span></div>';
        h+='<div class="jcell center"><span class="pos">中心・本人</span><span class="star">'+esc(s.center||'')+'</span></div>';
        h+='<div class="jcell"><span class="pos">社会（東）</span><span class="star">'+esc(s.shakai||'')+'</span></div>';
        h+='<div class="jcell jusei-cell"><span class="pos">晩年運</span><span class="star gold">'+esc(s.bannen||'')+'</span></div>';
        h+='<div class="jcell"><span class="pos">目下（南）</span><span class="star">'+esc(s.meshita||'')+'</span></div>';
        h+='<div class="jcell jusei-cell"><span class="pos">中年運</span><span class="star gold">'+esc(s.chunen||'')+'</span></div>';
        h+='</div>';
      }
      h+='</div></div>';
    }

    // 本質（Note群）
    var notes=[];
    ['elementNote','specialNote','tenchuNote','starsNote','chukuseiNote','guardianNote'].forEach(function(k){if(cl[k])notes.push(cl[k]);});
    if(notes.length){
      h+='<div class="sec"><div class="sec-head"><span class="sec-no">壱</span><span class="sec-title">どういう魂か</span></div><div class="card">';
      notes.forEach(function(p){h+='<p>'+esc(p)+'</p>';});
      h+='</div></div>';
    }

    // 五つの視点
    if(d.fiveViews&&d.fiveViews.length){
      h+='<div class="sec"><div class="sec-head"><span class="sec-no">弐</span><span class="sec-title">五つの視点 ─ ぐるりと見る</span></div><div class="card views">';
      d.fiveViews.forEach(function(v){h+='<div class="v"><div class="vk">'+esc(v.key)+'</div><div class="vb">'+esc(v.body)+'</div></div>';});
      h+='</div></div>';
    }

    // in depth
    var occ=d.fiveOccultists||d.fiveViewsDeep;
    if(occ&&occ.length){
      h+='<div class="sec"><div class="sec-head"><span class="sec-no">参</span><span class="sec-title">in depth ― さらに深く</span></div><div class="card occ">';
      occ.forEach(function(o){h+='<div class="o"><div class="on">'+esc(o.name)+'</div><div class="ov">'+esc(o.view||'')+'</div><div class="ob">'+esc(o.body)+'</div></div>';});
      h+='</div></div>';
    }

    // 陽陰
    var win=d.winPatterns||[], lose=d.losePatterns||[];
    if(win.length||lose.length){
      h+='<div class="sec"><div class="sec-head"><span class="sec-no">肆</span><span class="sec-title">陽 ・ 陰</span></div><div class="card"><div class="pat">';
      h+='<div class="patcol pat-y"><h4>大切にすること</h4><ul>'+win.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      h+='<div class="patcol pat-n"><h4>気をつけること</h4><ul>'+lose.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      h+='</div></div></div>';
    }

    // 暦リンク＋引き戸
    h+='<a class="koyomi-link" href="/'+esc(c)+'"><span class="arrow">▶</span> '+esc(name)+'の暦（日々の運気）をひらく<small>毎日の運気を、天気予報のように</small></a>';
    h+='<div class="door" onclick="this.classList.toggle(\'open\')"><div class="door-gate"><a class="door-inner" href="/menu">鑑定目録</a><div class="door-leaf door-leaf-l"><span class="door-pull"></span></div><div class="door-leaf door-leaf-r"><span class="door-pull"></span></div></div><p class="door-note">戸をあけると、鑑定の目録があります</p></div>';
    h+='<footer><p>いつもおおきにです😆</p><p class="sig">㐂</p></footer>';

    app.innerHTML=h;
  }
})();
</script>
